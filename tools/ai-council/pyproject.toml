[project]
name = "ssc-ai-council"
version = "0.1.0"
description = "Controlled LangGraph orchestration for Codex, Claude Code/GLM, and CrewAI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai>=1.14,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "pydantic>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.15,<1",
]

[project.scripts]
ai-council = "ai_council.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_council"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ai_council"]
