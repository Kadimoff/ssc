server {
  listen 80;
  server_name _;

  location = / {
    return 302 /ssc/;
  }

  location = /ssc {
    return 302 /ssc/;
  }

  location /ssc/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /ssc/index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
