name: ssc-partnership-os

services:
  api:
    build:
      context: ./server
    environment:
      PORT: 3443
      DATABASE_URL: postgres://ssc:ssc_dev_password@postgres:5432/ssc
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-32-characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ssc_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ssc_minio_password}
      MINIO_BUCKET: ssc-evidence
      SMTP_URL: smtp://mailpit:1025
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-5000}
    ports:
      - "3443:3443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ssc
      POSTGRES_PASSWORD: ssc_dev_password
      POSTGRES_DB: ssc
    ports:
      - "5432:5432"
    volumes:
      - ssc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssc -d ssc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ssc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ssc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ssc_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ssc_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  ssc_postgres:
  ssc_redis:
  ssc_minio:
